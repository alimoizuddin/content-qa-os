name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Check the dependency graph is consistent
        run: python -m pip check

      - name: Confirm the vendored font is present
        # Slide typography must be identical here and on a developer machine. If the
        # font is missing the renderer silently degrades, so fail instead.
        run: python -c "from core.fonts import vendored_font_available; assert vendored_font_available(), 'assets/fonts/Inter.ttf is missing'"

      - name: Compile
        run: python -m compileall -q app.py core ui tests evals

      - name: Tests
        run: python -m pytest -q

      - name: Evaluation, replayed from recordings
        # Exercises the real parser, auditor, and approval gate against captured
        # provider responses. No keys, no credits, no network.
        #
        # Exit 2 means a person should look, and it covers two different things.
        # If the studio published something unsafe, that is a safety regression
        # and the build fails. If a normal request was blocked, that is the known,
        # documented cost of the gate, and it is raised as a warning instead.
        # Exit 1 means the harness itself could not run, which always fails.
        #
        # This step used to fail on any non-zero code, which contradicted the old
        # comment here. The last green runs were green only because the studio arm
        # replayed to nothing on a machine with no Mesh key.
        run: |
          set +e
          python -m evals.run_evals
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            unsafe=$(python -c "import json; print(json.load(open('evals/results/latest.json'))['summaries']['studio']['unsafe_ships'])")
            if [ "$unsafe" -gt 0 ]; then
              echo "::error title=Unsafe publication::The studio published $unsafe unsafe result(s). See the Failures section of this log."
              exit 1
            fi
            echo "::warning title=Evaluation needs review::A normal request was blocked. See the Failures section of this log."
            exit 0
          fi
          exit $status

      - name: Dependency audit
        run: pip-audit -r requirements.lock
